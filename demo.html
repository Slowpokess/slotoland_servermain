<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Слоты - Демо</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .login-section {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .symbol {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            background: white;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            animation: spin-in 0.5s ease-out;
        }

        @keyframes spin-in {
            from {
                transform: rotateY(0deg) scale(0.5);
                opacity: 0;
            }
            to {
                transform: rotateY(360deg) scale(1);
                opacity: 1;
            }
        }

        .symbol.winning {
            animation: win-pulse 0.6s infinite;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
        }

        @keyframes win-pulse {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                box-shadow: 0 0 20px #ffd700;
            }
            50% {
                transform: scale(1.1) rotate(5deg);
                box-shadow: 0 0 40px #ffd700;
            }
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-box {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .info-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .btn {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-spin {
            background: linear-gradient(145deg, #ff4444, #cc0000);
            color: white;
            box-shadow: 0 5px 15px rgba(255,68,68,0.4);
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,68,68,0.6);
        }

        .btn-spin:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-collect {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 5px 15px rgba(76,175,80,0.4);
        }

        .btn-collect:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(76,175,80,0.6);
        }

        .btn-double {
            background: linear-gradient(145deg, #2196F3, #1976D2);
            color: white;
            box-shadow: 0 5px 15px rgba(33,150,243,0.4);
        }

        .btn-double:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(33,150,243,0.6);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255,255,255,0.2);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(76,175,80,0.6);
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .message.success {
            background: rgba(76,175,80,0.2);
            border: 1px solid #4CAF50;
        }

        .message.error {
            background: rgba(244,67,54,0.2);
            border: 1px solid #f44336;
        }

        .message.info {
            background: rgba(33,150,243,0.2);
            border: 1px solid #2196F3;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .game-title {
            text-align: center;
            font-size: 2em;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .wins-display {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #000;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(255,215,0,0.4);
            display: none;
        }

        .wins-display.show {
            display: block;
            animation: win-flash 0.5s ease-out;
        }

        @keyframes win-flash {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 DOLPHIN SLOTS 🐬</h1>

        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <h2 style="text-align: center; margin-bottom: 20px;">Вход в систему</h2>
            <div id="loginMessage"></div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" value="test@example.org" placeholder="test@example.org">
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" id="password" value="test123" placeholder="test123">
            </div>
            <button class="btn-login" onclick="login()">🔐 ВОЙТИ</button>
            <p style="text-align: center; margin-top: 15px; color: #aaa;">
                Новый пользователь? <a href="#" onclick="register()" style="color: #4CAF50;">Зарегистрироваться</a>
            </p>
        </div>

        <!-- Game Section -->
        <div id="gameSection" class="game-section">
            <h2 class="game-title">🐬 JOKER DOLPHIN 🐬</h2>

            <div id="gameMessage" class="message" style="display: none;"></div>

            <div id="winsDisplay" class="wins-display"></div>

            <div id="gameGrid" class="game-grid">
                <!-- Symbols will be rendered here -->
            </div>

            <div class="info-panel">
                <div class="info-box">
                    <div class="info-label">💰 КОШЕЛЁК</div>
                    <div class="info-value" id="wallet">0</div>
                </div>
                <div class="info-box">
                    <div class="info-label">🎰 ВЫИГРЫШ</div>
                    <div class="info-value" id="win">0</div>
                </div>
                <div class="info-box">
                    <div class="info-label">💵 СТАВКА</div>
                    <div class="info-value" id="bet">1</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-spin" id="spinBtn" onclick="spin()">
                    🎲 КРУТИТЬ
                </button>
                <button class="btn btn-collect" id="collectBtn" onclick="collect()" disabled>
                    ✅ СОБРАТЬ
                </button>
                <button class="btn btn-double" id="doubleBtn" onclick="doubleUp()" disabled>
                    2x УДВОИТЬ
                </button>
            </div>

            <div style="margin-top: 20px; text-align: center;">
                <button class="btn" style="background: #666; padding: 10px 20px;" onclick="logout()">
                    🚪 ВЫЙТИ
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        let token = null;
        let uid = null;
        let gid = null;
        let wallet = 0;

        // Symbol emojis
        const symbols = {
            1: '🍒', 2: '🍋', 3: '🍊', 4: '🍇',
            5: '⭐', 6: '💎', 7: '7️⃣', 8: '🔔',
            9: '🐬', 10: '🌊', 11: '🐠', 12: '🦈'
        };

        function getSymbol(id) {
            return symbols[id] || '❓';
        }

        function showMessage(section, text, type = 'info') {
            const msg = document.getElementById(section + 'Message');
            msg.className = 'message ' + type;
            msg.textContent = text;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }

        function showWins(text) {
            const display = document.getElementById('winsDisplay');
            display.textContent = text;
            display.classList.add('show');
            setTimeout(() => {
                display.classList.remove('show');
            }, 3000);
        }

        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(API_URL + '/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        secret: password,
                        name: email.split('@')[0]
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('login', '✅ Регистрация успешна! Теперь войдите.', 'success');
                } else {
                    showMessage('login', '❌ Ошибка: ' + data.what, 'error');
                }
            } catch (error) {
                showMessage('login', '❌ Ошибка соединения', 'error');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(API_URL + '/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        secret: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.access;
                    uid = data.uid;
                    localStorage.setItem('token', token);
                    localStorage.setItem('uid', uid);

                    showMessage('login', '✅ Успешный вход! Запуск игры...', 'success');

                    setTimeout(async () => {
                        await createGame();
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('gameSection').classList.add('active');
                    }, 1000);
                } else {
                    showMessage('login', '❌ Ошибка: ' + data.what, 'error');
                }
            } catch (error) {
                showMessage('login', '❌ Ошибка соединения. Убедитесь, что сервер запущен на порту 8080', 'error');
            }
        }

        async function createGame() {
            try {
                const response = await fetch(API_URL + '/game/new', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        cid: 1,
                        uid: uid,
                        alias: 'Novomatic/Joker Dolphin'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    gid = data.gid;
                    wallet = data.wallet;
                    renderScreen(data.game.screen);
                    updateInfo();
                    showMessage('game', '🎮 Игра создана! Удачи!', 'success');
                } else {
                    showMessage('game', '❌ Ошибка: ' + data.what, 'error');
                }
            } catch (error) {
                showMessage('game', '❌ Ошибка создания игры', 'error');
            }
        }

        function renderScreen(screen) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            screen.forEach(row => {
                row.forEach(symbol => {
                    const cell = document.createElement('div');
                    cell.className = 'symbol';
                    cell.textContent = getSymbol(symbol);
                    grid.appendChild(cell);
                });
            });
        }

        function updateInfo() {
            document.getElementById('wallet').textContent = wallet.toFixed(2);
        }

        async function spin() {
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> КРУТИМ...';

            try {
                const response = await fetch(API_URL + '/slot/spin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ gid: gid })
                });

                const data = await response.json();

                if (response.ok) {
                    // Animate symbols
                    renderScreen(data.screen);

                    wallet = data.wallet;
                    updateInfo();

                    if (data.gain > 0) {
                        document.getElementById('win').textContent = data.gain.toFixed(2);
                        showWins('🎉 ВЫИГРЫШ: ' + data.gain.toFixed(2) + '!');
                        document.getElementById('collectBtn').disabled = false;
                        document.getElementById('doubleBtn').disabled = false;
                    } else {
                        document.getElementById('win').textContent = '0';
                        document.getElementById('collectBtn').disabled = true;
                        document.getElementById('doubleBtn').disabled = true;
                    }

                    // Check free spins
                    if (data.fs > 0) {
                        showMessage('game', '🎁 FREE SPINS: ' + data.fs, 'info');
                    }
                } else {
                    showMessage('game', '❌ Ошибка: ' + data.what, 'error');
                }
            } catch (error) {
                showMessage('game', '❌ Ошибка спина', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🎲 КРУТИТЬ';
            }
        }

        async function collect() {
            try {
                const response = await fetch(API_URL + '/slot/collect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ gid: gid })
                });

                const data = await response.json();

                if (response.ok) {
                    wallet = data.wallet;
                    updateInfo();
                    document.getElementById('win').textContent = '0';
                    document.getElementById('collectBtn').disabled = true;
                    document.getElementById('doubleBtn').disabled = true;
                    showMessage('game', '✅ Выигрыш собран!', 'success');
                } else {
                    showMessage('game', '❌ Ошибка: ' + data.what, 'error');
                }
            } catch (error) {
                showMessage('game', '❌ Ошибка', 'error');
            }
        }

        async function doubleUp() {
            try {
                const response = await fetch(API_URL + '/slot/doubleup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        gid: gid,
                        mult: 2
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    wallet = data.wallet;
                    updateInfo();

                    if (data.gain > 0) {
                        document.getElementById('win').textContent = data.gain.toFixed(2);
                        showWins('🎉 УДВОЕНО: ' + data.gain.toFixed(2) + '!');
                    } else {
                        document.getElementById('win').textContent = '0';
                        document.getElementById('collectBtn').disabled = true;
                        document.getElementById('doubleBtn').disabled = true;
                        showMessage('game', '😢 Упали... попробуйте еще раз!', 'error');
                    }
                } else {
                    showMessage('game', '❌ Ошибка: ' + data.what, 'error');
                }
            } catch (error) {
                showMessage('game', '❌ Ошибка удвоения', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('uid');
            token = null;
            uid = null;
            gid = null;
            document.getElementById('gameSection').classList.remove('active');
            document.getElementById('loginSection').style.display = 'block';
        }

        // Auto-login if token exists
        window.onload = function() {
            const savedToken = localStorage.getItem('token');
            const savedUid = localStorage.getItem('uid');

            if (savedToken && savedUid) {
                token = savedToken;
                uid = parseInt(savedUid);
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('gameSection').classList.add('active');
                createGame();
            }
        };
    </script>
</body>
</html>
